name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: omp-orca-dispatch-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: xart-safe
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: http://172.17.0.1:8419/actions/checkout@v4

      - name: Set up Node.js
        uses: http://172.17.0.1:8419/actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check behavior and types
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Inspect publish archive
        run: npm run package:dry-run
