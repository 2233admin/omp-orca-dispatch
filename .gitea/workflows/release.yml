name: Publish npm release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish package to npm
    runs-on: xart-safe
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: http://172.17.0.1:8419/actions/checkout@v4

      - name: Set up Node.js
        uses: http://172.17.0.1:8419/actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check behavior and types
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ gitea.ref_name }}
        run: node -e "const fs = require('node:fs'); const expected = 'v' + JSON.parse(fs.readFileSync('package.json', 'utf8')).version; if (process.env.RELEASE_TAG !== expected) { console.error('Release tag does not match package version'); process.exit(1); }"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
